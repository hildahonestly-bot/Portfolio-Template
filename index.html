<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Amaka Okoji | Strategy, Creative, Real Impact</title>
<meta content="Amaka Okoji is a brand strategist and marketing leader helping ambitious brands grow, connect and create work that matters." name="description"/>
<style>
:root{
  --black:#050505;
  --cream:#f4efe5;
  --orange:#f4511e;
  --muted:#9b968e;
  --line:rgba(244,239,229,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--black);
  color:var(--cream);
  font-family:Arial, Helvetica, sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.page{max-width:1440px;margin:0 auto;overflow:hidden}

/* NAV */
.nav{
  height:86px;
  padding:0 50px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  position:relative;
  z-index:10;
}
.logo{
  font-size:17px;
  letter-spacing:.17em;
  font-weight:500;
}
.navlinks{
  display:flex;
  gap:42px;
  font-size:13px;
}
.navlinks a{opacity:.9}
.nav-cta{
  justify-self:end;
  border:1px solid rgba(244,239,229,.52);
  border-radius:999px;
  padding:11px 17px 11px 20px;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:24px;
}

/* HERO */
.hero{
  position:relative;
  min-height:700px;
  display:grid;
  grid-template-columns:46% 54%;
}
.hero-copy{
  position:relative;
  z-index:4;
  padding:92px 0 72px 52px;
}
.hero-title{
  margin:0;
  max-width:690px;
  font-size:clamp(64px,6.45vw,103px);
  line-height:.85;
  letter-spacing:-.075em;
  font-weight:900;
  text-transform:uppercase;
}
.hero-title .orange{color:var(--orange)}
.hero-desc{
  width:410px;
  max-width:90%;
  margin:24px 0 26px;
  font-size:17px;
  line-height:1.38;
  letter-spacing:-.02em;
}
.outline-btn{
  display:inline-flex;
  align-items:center;
  gap:28px;
  border:1px solid rgba(244,239,229,.58);
  border-radius:999px;
  padding:12px 17px 12px 21px;
  font-size:13px;
}
.hero-visual{
  position:absolute;
  z-index:2;
  right:-3px;
  top:-4px;
  width:64%;
  height:735px;
  overflow:hidden;
  pointer-events:none;
}
.hero-visual img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
}
.hero-note{
  position:absolute;
  z-index:5;
  right:54px;
  bottom:76px;
  width:145px;
  transform:rotate(-6deg);
  font-family:"Segoe Print","Bradley Hand",cursive;
  font-size:25px;
  line-height:1.05;
  color:#f4efe5;
}
.hero-note:after{
  content:"";
  display:block;
  width:92px;
  height:3px;
  background:var(--orange);
  margin:6px 0 0 6px;
  transform:rotate(-4deg);
}

/* WORK */
.work{
  position:relative;
  z-index:6;
  padding:0 50px 125px;
}
.section-label{
  font-size:10px;
  letter-spacing:.30em;
  color:#aaa59c;
  margin-bottom:18px;
}
.work-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
}
.work-card{min-width:0}
.work-image{
  height:200px;
  overflow:hidden;
  background:#111;
}
.work-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.work-card:nth-child(1) .work-image img{object-position:center}
.work-card:nth-child(2) .work-image img{object-position:center}
.work-card:nth-child(3) .work-image img{object-position:center}
.work-card:nth-child(4) .work-image img{object-position:center}
.work-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:11px;
  font-size:15px;
}
.work-arrow{font-size:19px}
.work-sub{
  color:#9f9a91;
  font-size:12px;
  margin-top:5px;
}

/* APPROACH */
.approach{
  border-top:1px solid var(--line);
  padding:0 50px 130px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:90px;
}
.approach-left{padding-top:22px}
.approach-title{
  margin:0;
  font-size:clamp(64px,6.2vw,99px);
  line-height:.84;
  letter-spacing:-.075em;
  font-weight:900;
}
.approach-title .orange{color:var(--orange)}
.approach-foot{
  margin-top:25px;
  color:#68645e;
  font-size:9px;
  letter-spacing:.34em;
}
.approach-right{padding-top:48px}
.approach-intro{
  max-width:365px;
  margin:0 0 32px;
  font-size:16px;
  line-height:1.38;
}
.approach-list{border-top:1px solid var(--line)}
.approach-row{
  display:grid;
  grid-template-columns:43px 1fr;
  padding:13px 0;
  border-bottom:1px solid rgba(244,239,229,.10);
  font-size:14px;
}
.approach-num{color:#858079}
.more-btn{margin-top:31px}

/* FOOTER */
.footer{
  border-top:1px solid var(--line);
  padding:72px 50px 38px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:70px;
}
.footer-title{
  margin:0;
  max-width:700px;
  font-size:clamp(54px,6vw,91px);
  line-height:.86;
  letter-spacing:-.075em;
  font-weight:900;
  text-transform:uppercase;
}
.footer-title .orange{color:var(--orange)}
.footer-right{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:205px;
}
.footer-contact{
  font-size:17px;
  line-height:1.35;
}
.footer-contact a{text-decoration:underline;text-underline-offset:4px}
.footer-links{
  display:flex;
  gap:28px;
  flex-wrap:wrap;
  font-size:12px;
  color:#aaa59c;
}
.footer-bottom{
  grid-column:1/-1;
  border-top:1px solid rgba(244,239,229,.10);
  padding-top:17px;
  margin-top:38px;
  display:flex;
  justify-content:space-between;
  color:#67635d;
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
}

/* RESPONSIVE */
@media (max-width:1000px){
  .nav{padding:0 30px}
  .navlinks{gap:22px}
  .hero{grid-template-columns:48% 52%;min-height:660px}
  .hero-copy{padding-left:30px}
  .hero-title{font-size:clamp(57px,7.2vw,78px)}
  .hero-visual{width:62%;height:690px}
  .work{padding-left:30px;padding-right:30px}
}

@media (max-width:760px){
  .nav{height:68px;padding:0 22px;grid-template-columns:1fr auto}
  .navlinks{display:none}
  .nav-cta{border:none;padding:0}
  .logo{font-size:14px}
  .hero{grid-template-columns:1fr;min-height:auto}
  .hero-copy{padding:60px 22px 40px}
  .hero-title{font-size:clamp(36px,9.5vw,60px)}
  .hero-desc{width:100%;max-width:none;margin:18px 0 22px}
  .hero-visual{position:relative;width:100%;height:auto;right:auto;top:auto}
  .hero-visual img{height:auto}
  .hero-note{display:none}
  .work{padding:0 22px 80px}
  .work-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .approach{grid-template-columns:1fr;gap:50px;padding:0 22px 80px}
  .approach-left{padding-top:0}
  .approach-right{padding-top:0}
  .footer{grid-template-columns:1fr;gap:30px;padding:40px 22px 25px}
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function(){
  (function(){
    const links = document.querySelectorAll('a[href^="#"]');
    const sections = Array.from(document.querySelectorAll('[id]')).filter(el => el.offsetParent !== null);
    
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;top:0;left:0;height:2px;width:0;background:#f4511e;z-index:9999;transform-origin:left center;pointer-events:none;';
    document.body.appendChild(bar);

    const update = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (max > 0 ? Math.min(100, Math.max(0, window.scrollY / max * 100)) : 0) + '%';
      const y = window.scrollY + 140;
      let current = sections[0];
      sections.forEach(sec => { if (sec.offsetTop <= y) current = sec; });
      links.forEach(a => a.style.opacity = a.getAttribute('href') === '#' + current.id ? '1' : '.62');
    };
    window.addEventListener('scroll', update, {passive:true});
    update();
  })();
});
</script>

<style>
/* FINAL MANIFESTO SECTION: preserve the original two-panel composition */
.presence-motion{
  display:grid;
  grid-template-columns:50% 50%;
  height:calc(50vw * .92516);
  min-height:0;
  padding:0;
  border-top:1px solid var(--line);
  background:#050505;
  overflow:hidden;
}
.presence-photo,.presence-ring-panel{
  min-width:0;
  height:100%;
  overflow:hidden;
}
.presence-photo{background:#050505}
.presence-photo img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center center;
}
.presence-ring-panel{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#050505;
}
.manifesto-ring{
  width:min(620px,72%);
  height:min(620px,72%);
  position:relative;
  z-index:2;
  animation:manifestoSpin 42s linear infinite;
  transform-origin:center;
}
.manifesto-ring svg{width:100%;height:100%;overflow:visible;display:block}
.manifesto-ring .ring-track{
  fill:none;
  stroke:rgba(244,239,229,.055);
  stroke-width:1;
}
.ring-rotor{transform-origin:300px 300px}
.ring-text,.ring-glint-text{
  font-family:Arial,Helvetica,sans-serif;
  font-size:14px;
  font-weight:900;
  letter-spacing:.85px;
  text-transform:uppercase;
  paint-order:stroke fill;
  stroke:rgba(7,7,7,.98);
  stroke-width:3.4px;
}
.ring-text{
  fill:url(#ringMetal);
  filter:drop-shadow(1.5px 2px 0 rgba(255,255,255,.34)) drop-shadow(-2.5px -2.5px 4px rgba(0,0,0,1));
}
.ring-glint-text{
  fill:url(#glintGradient);
  opacity:.0;
  filter:drop-shadow(0 0 5px rgba(255,248,225,.85));
  animation:ringSweep 6.8s ease-in-out infinite;
}
@keyframes ringSweep{
  0%,64%,100%{opacity:0}
  72%{opacity:.10}
  79%{opacity:.96}
  86%{opacity:.05}
}
@keyframes manifestoSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media(max-width:900px){
  .presence-motion{grid-template-columns:1fr;height:auto;min-height:0}
  .presence-photo{height:auto;aspect-ratio:922 / 853}
  .presence-ring-panel{height:620px}
  .manifesto-ring{width:360px;height:360px;max-width:72%;max-height:72%}
}
@media(prefers-reduced-motion:reduce){.manifesto-ring,.ring-glint-text{animation:none}}
.manifesto-caption{
  position:absolute;
  left:50%;
  bottom:7.5%;
  transform:translateX(-50%);
  font-size:11px;
  letter-spacing:3px;
  color:rgba(244,239,229,.42);
  white-space:nowrap;
  z-index:3;
}
@media(max-width:900px){
  .manifesto-caption{bottom:6%;font-size:10px;letter-spacing:2.5px}
}
</style>

<style>
/* APPROVED VISUAL REFINEMENT */
.work-head,.stories-head,.road-head,.camera-head{display:flex;align-items:baseline;justify-content:space-between;gap:30px}
.work-head .section-label,.stories-head .section-label,.road-head .section-label{margin:0}
.section-link,.camera-link{color:#77736d;text-decoration:none;font-size:9px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;transition:color .2s ease}
.section-link:hover,.camera-link:hover{color:#f4511e}

/* Brand rail: substantial enough to read as social proof */
.brand-rail{padding:24px 0 27px;background:#050505;border-top:1px solid rgba(244,239,229,.12);border-bottom:1px solid rgba(244,239,229,.12)}
.brand-rail-head{padding:0 50px 18px;color:#77736d;font-size:9px;letter-spacing:.22em}
.brand-set{gap:clamp(58px,7vw,112px);padding:0 50px}
.brand-logo{height:54px;min-width:112px}
.brand-logo img{max-width:132px;max-height:40px;filter:invert(1) brightness(1.85);opacity:.9}
.brand-logo:nth-child(1) img,.brand-logo:nth-child(5) img,.brand-logo:nth-child(7) img{max-height:44px}

/* Camera archive: editorial collage rather than an empty horizontal strip */
.camera-roll{padding:0 0 105px;background:#050505;border-top:1px solid var(--line);overflow:hidden}
.camera-head{padding:24px 50px 27px}
.camera-head .section-label{padding:0;margin:0}
.camera-grid{display:grid;grid-template-columns:1.15fr .82fr 1fr 1.05fr .82fr;grid-auto-rows:190px;gap:14px;padding:0 50px}
.camera-item{position:relative;min-width:0;height:auto!important;margin:0!important;transform:none!important;overflow:hidden;background:#111 center/cover no-repeat;border:1px solid rgba(244,239,229,.08);box-shadow:0 16px 38px rgba(0,0,0,.28);transition:transform .35s ease,filter .35s ease}
.camera-item.wide{grid-column:span 2}
.camera-item.tall{grid-row:span 2}
.camera-item:after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(5,5,5,.72),transparent 48%);pointer-events:none}
.camera-caption{position:absolute;left:12px;bottom:11px;z-index:2;padding:6px 8px;background:rgba(5,5,5,.84);font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:#f4efe5}
.camera-item:hover{transform:translateY(-5px) scale(1.01)!important;filter:brightness(1.08)}

/* Stories */
.stories{padding-bottom:105px}
.stories-head{padding-top:24px;margin-bottom:26px}
.stories>.section-label{padding-top:0;margin-bottom:0}

/* Roadmap */

.roadmap>.section-label{padding-top:0;margin-bottom:0}

/* Approach */
.approach{min-height:430px}
.approach-left{padding-right:30px}
.approach-right{padding-left:50px}

/* Services: four equal editorial cards */
.services{padding-bottom:105px}
.services>.section-label{padding-top:24px;margin-bottom:25px}
.services-grid{grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid rgba(244,239,229,.14)}
.service-item,.service-item:nth-child(odd),.service-item:nth-child(even){min-height:205px;padding:25px 24px 28px;border-right:1px solid rgba(244,239,229,.14);border-bottom:1px solid rgba(244,239,229,.14);display:block}
.service-item:last-child{border-right:0}
.service-num{display:block;margin-bottom:22px}

.service-item p{font-size:11px;line-height:1.4;max-width:230px}

/* Testimonials */
